name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit and end-to-end tests (standard library only)
        run: python -m unittest discover -s tests -v
      - name: Install and run the command
        run: |
          pip install .
          secondlook --version
          secondlook -f examples/scam-phishing.eml || test $? -eq 20
        shell: bash
